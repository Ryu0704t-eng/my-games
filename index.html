          b.lastFx = now; b.fxn++;
          const kd = FX_KINDS[rndInt(0, FX_KINDS.length - 1)];
          rtdb('PATCH', '/rooms/' + b.code + '/fx/' + Rank.uid, { n: b.fxn, kind: kd }).catch(() => {});
          btToast('じゃまを送った!(' + FX_LABEL[kd] + ')');
        }
      }
    }, 500);
  }

  async function battleLeave() {
    const b = battle; if (!b) return;
    battle = null;
    if (b.poll) clearInterval(b.poll);
    if (b.cd) clearTimeout(b.cd);
    if (b.samp) clearInterval(b.samp);
    fxClear();
    try {
      if (b.role === 'host') await rtdb('DELETE', '/rooms/' + b.code);
      else await rtdb('PATCH', '/rooms/' + b.code, { guestUid: null, guestName: null });
    } catch (e) {}
  }

  function battleMenu(msg) {
    if (typeof requireAcct === 'function' && !requireAcct()) return;
    closeGame(); setView('battle'); bbox.textContent = '';
    bbox.append(bt('h1', '', '対戦モード'));
    bbox.append(bt('p', 'sub', '友だちと同じゲームを同時に遊んで、スコアで勝負します。スコアがある程度まで上がるたびに、あいての画面に「じゃま」が入ります(ぼやける・逆さま・黒いしみ・ゆれる)。部屋をつくって、コードを友だちに伝えてください。'));
    bbox.append(bt('p', 'bt-me', 'あなたの名前: ' + Rank.name() + '(ホームで変えられます)'));
    const c1 = bt('section', 'bt-card');
    c1.append(bt('h2', '', '部屋をつくる'));
    const sel = bt('select', 'bt-sel'); sel.setAttribute('aria-label', 'ゲームを選ぶ');
    GAMES.filter((g) => g.id !== 'wolf' && g.id !== 'wolfnet' && g.id !== 'wordwolf' && g.id !== 'feign').forEach((g) => { const o = bt('option', '', g.name); o.value = g.id; sel.append(o); });
    const dsel = bt('select', 'bt-sel'); dsel.setAttribute('aria-label', 'むずかしさ');
    DIFFS.forEach((d, i) => { const o = bt('option', '', 'むずかしさ: ' + d.n); o.value = String(i); if (i === DIFF) o.selected = true; dsel.append(o); });
    const mk = bt('button', 'btn', '部屋をつくる'); mk.type = 'button';
    mk.addEventListener('click', () => battleCreate(sel.value, Number(dsel.value), mk));
    c1.append(sel, dsel, mk);
    const c2 = bt('section', 'bt-card');
    c2.append(bt('h2', '', '部屋に入る'));
    const inp = bt('input', 'bt-in'); inp.type = 'text'; inp.maxLength = 4; inp.placeholder = 'コード4文字'; inp.autocomplete = 'off'; inp.setAttribute('aria-label', '部屋のコード');
    const jn = bt('button', 'btn', '入る'); jn.type = 'button';
    jn.addEventListener('click', () => battleJoin(inp.value, jn));
    c2.append(inp, jn);
    const m = bt('p', 'bt-msg', msg || ''); m.id = 'btMsg';
    bbox.append(c1, c2, m);
  }
  const btMsg = (t) => { const m = $('#btMsg'); if (m) m.textContent = t || ''; };

  async function battleCreate(gid, diff, btn) {
    btn.disabled = true; btMsg('部屋をつくっています…');
    try {
      let code = '';
      for (let i = 0; i < 6 && !code; i++) {
        const c = Array.from({ length: 4 }, () => CODE_CH[Math.floor(Math.random() * CODE_CH.length)]).join('');
        if ((await rtdb('GET', '/rooms/' + c)) === null) code = c;
      }
      if (!code) throw new Error('code');
      await rtdb('PUT', '/rooms/' + code, { game: gid, diff: diff, hostUid: Rank.uid, hostName: Rank.name(), state: 'wait', round: 0, at: Date.now() });
      battleEnter(code, 'host', { round: 0 });
    } catch (e) { btn.disabled = false; btMsg('部屋をつくれませんでした。通信とFirebaseのルールを確認してください。'); }
  }
  async function battleJoin(raw, btn) {
    const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 4) { btMsg('コードは4文字です。'); return; }
    btn.disabled = true; btMsg('さがしています…');
    try {
      const room = await rtdb('GET', '/rooms/' + code);
      if (!room) { btn.disabled = false; btMsg('その部屋が見つかりません。'); return; }
      if (room.hostUid === Rank.uid) { btn.disabled = false; btMsg('自分がつくった部屋です。'); return; }
      if (room.guestUid && room.guestUid !== Rank.uid) { btn.disabled = false; btMsg('その部屋はもういっぱいです。'); return; }
      await rtdb('PATCH', '/rooms/' + code, { guestUid: Rank.uid, guestName: Rank.name() });
      battleEnter(code, 'guest', room);
    } catch (e) { btn.disabled = false; btMsg('入れませんでした。通信を確認してください。'); }
  }
  function battleEnter(code, role, room) {
    battle = { code: code, role: role, room: null, inGame: false, counting: false, waiting: false, lastRound: Number(room.round) || 0, busy: false, sig: '', cd: 0, poll: 0, myScore: null, waitSince: 0 };
    battle.poll = setInterval(battleTick, 800);
    battleTick();
  }
  async function battleTick() {
    const b = battle; if (!b || b.busy) return;
    b.busy = true;
    try {
      const room = await rtdb('GET', '/rooms/' + b.code);
      if (battle !== b) return;
      if (!room) { await battleLeave(); battleMenu('部屋がなくなりました。'); return; }
      b.room = room; battleOnRoom();
    } catch (e) { /* 通信の一時的な失敗は次のtickで再試行 */ } finally { b.busy = false; }
  }
  function oppOf(room) { return battle.role === 'host' ? { uid: room.guestUid, name: room.guestName } : { uid: room.hostUid, name: room.hostName }; }
  function battleOnRoom() {
    const b = battle, room = b.room;
    if (room.state === 'play' && Number(room.round) !== b.lastRound && !b.counting) { battleBegin(room); return; }
    if (b.inGame) {
      const op = oppOf(room), lv = room.live && op.uid && room.live[op.uid], fx = room.fx && op.uid && room.fx[op.uid];
      if (lv && b.chip) b.chip.textContent = 'あいて ' + (Number(lv.s) || 0);
      if (fx && Number(fx.n) > (b.fxSeen || 0)) { b.fxSeen = Number(fx.n); applyFx(String(fx.kind), op.name); }
    }
    if (b.waiting) { battleShowResult(); return; }
    if (!b.inGame && !b.counting) {
      const sig = [room.guestUid || '', room.guestName || '', room.game, room.round].join('|');
      if (sig !== b.sig) { b.sig = sig; battleLobby(); }
    }
  }
  function battleLobby() {
    const b = battle, room = b.room, g = byId(room.game) || GAMES[0];
    closeGame(); setView('battle'); bbox.textContent = '';
    b.sig = [room.guestUid || '', room.guestName || '', room.game, room.round].join('|');
    bbox.append(bt('p', 'sub', '部屋のコード(友だちに伝えてください)'));
    bbox.append(bt('div', 'bt-code', b.code));
    const gc = bt('section', 'bt-card');
    gc.append(bt('h2', '', g.name), bt('p', 'sub', g.intro), bt('p', 'bt-me', 'むずかしさ: ' + DIFFS[clampN(Number(room.diff) || 1, 0, 2)].n));
    const ul = bt('ul', 'how'); g.how.forEach((t) => ul.append(bt('li', '', t))); gc.append(ul);
    const pl = bt('section', 'bt-card'); pl.append(bt('h2', '', 'さんかする人'));
    const opp = oppOf(room);
    const ol = bt('ol', 'bt-pl');
    ol.append(bt('li', 'me', Rank.name() + ' (あなた)'));
    ol.append(bt('li', opp.uid ? '' : 'wait', opp.uid ? (opp.name || 'プレイヤー') : '友だちを待っています…'));
    pl.append(ol);
    bbox.append(gc, pl);
    if (b.role === 'host') {
      const st = bt('button', 'btn', opp.uid ? '対戦スタート' : '友だちが入るまで待ってね'); st.type = 'button'; st.disabled = !opp.uid;
      st.addEventListener('click', async () => {
        st.disabled = true;
        try { await rtdb('PATCH', '/rooms/' + b.code, { state: 'play', round: (Number(b.room.round) || 0) + 1, scores: null, live: null, fx: null }); battleTick(); }
        catch (e) { st.disabled = false; }
      });
      bbox.append(st);
    } else bbox.append(bt('p', 'bt-msg', '部屋の人が開始するのを待っています…'));
    const lv = bt('button', 'btn ghost', 'ぬける'); lv.type = 'button';
    lv.addEventListener('click', async () => { await battleLeave(); battleMenu(); });
    bbox.append(lv);
  }
  function battleBegin(room) {
    const b = battle, g = byId(room.game) || GAMES[0];
    b.lastRound = Number(room.round) || 0; b.counting = true; b.inGame = false; b.waiting = false; b.myScore = null; b.verdictShown = false;
    DIFF = clampN(Number(room.diff) || 1, 0, 2);
    openGame(g);
    ovIntro.hidden = true;
    const cd = el('section', 'ov', '<div class="ov-in"><p>まもなく開始。' + g.name + '</p><h2 class="bt-cd">3</h2><p>じゅんびしてね</p></div>');
    stage.append(cd);
    let n = 3;
    const step = () => {
      if (battle !== b) return;
      n--;
      if (n > 0) { $('.bt-cd', cd).textContent = String(n); A.beep(660, 0.08, 'sine', 0.06); b.cd = setTimeout(step, 1000); return; }
      cd.remove(); b.counting = false; b.inGame = true;
      startPlay(); $('#pz').hidden = true; battleSampleStart(g);
    };
    A.unlock(); A.beep(660, 0.08, 'sine', 0.06);
    b.cd = setTimeout(step, 1000);
  }
  async function battleFinish(g, score, stats) {
    const b = battle; if (!b) return;
    b.inGame = false; b.waiting = true; b.myScore = score; b.waitSince = Date.now();
    battleSampleStop(); fxClear();
    ovResult.innerHTML = '<div class="ov-in"><h3>対戦けっか</h3><div class="res"><span class="lbl">あなたのスコア</span><span class="big"></span></div><div class="bt-vs"></div><p class="status">あいての終わりを待っています…</p><div class="btns"><button class="btn again" type="button" disabled>もういちど</button><button class="btn ghost home" type="button">ホームへ</button></div></div>';
    $('.big', ovResult).textContent = String(score);
    $('.home', ovResult).addEventListener('click', goHome);
    $('.again', ovResult).addEventListener('click', () => { b.waiting = false; b.sig = ''; battleOnRoom(); });
    ovResult.hidden = false;
    try { await rtdb('PUT', '/rooms/' + b.code + '/scores/' + Rank.uid, { name: Rank.name(), score: score }); } catch (e) {}
    battleTick();
  }
  function battleShowResult() {
    const b = battle; if (!b || !ovResult || !b.room) return;
    const opp = oppOf(b.room), sc = b.room.scores || {}, os = opp.uid && sc[opp.uid] ? Number(sc[opp.uid].score) : null;
    const st = $('.status', ovResult), vs = $('.bt-vs', ovResult);
    if (!st) return;
    if (os === null) {
      if (Date.now() - b.waitSince > 120000) st.textContent = 'あいてがまだ終わっていません。もう少し待つか、ホームへ戻ってください。';
      return;
    }
    const mine = b.myScore, verdict = mine > os ? 'あなたの勝ち!' : mine < os ? 'あなたの負け…' : '引き分け';
    vs.textContent = '';
    const r1 = bt('div', 'bt-r me'); r1.append(bt('span', '', Rank.name() + ' (あなた)'), bt('b', '', String(mine)));
    const r2 = bt('div', 'bt-r'); r2.append(bt('span', '', opp.name || 'プレイヤー'), bt('b', '', String(os)));
    vs.append(r1, r2);
    st.textContent = verdict; st.className = 'status bt-verdict';
    $('.again', ovResult).disabled = false;
    if (!b.verdictShown) { b.verdictShown = true; (mine >= os ? [523, 659, 784, 1047] : [392, 349, 311]).forEach((f, i) => A.beep(f, 0.18, 'triangle', 0.06, 0, i * 0.1)); }
  }

  /* ===== アカウント(なまえ + 4けたのあいことば) ===== */
  const LS_ACCT = 'arcade-acct';
  function hashStr(str) {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
  }
  const nameKey = (n) => 'n' + Array.from(new TextEncoder().encode(String(n).normalize('NFKC').toLowerCase().trim()), (x) => x.toString(16).padStart(2, '0')).join('');
  const pinHash = (key, pin) => hashStr('arcade|' + key + '|' + pin);

  function requireAcct() {
    if (lsGet(LS_ACCT)) return true;
    if (!document.querySelector('.acct')) acctModal();
    return false;
  }
  function acctLine() {
    const a = $('#acctLine'); if (!a) return;
    a.textContent = '';
    if (!lsGet(LS_ACCT)) return;
    a.append(document.createTextNode('ログイン中: ' + Rank.name() + ' '));
    const out = el('button', 'pill'); out.type = 'button'; out.textContent = 'ログアウト';
    out.addEventListener('click', () => {
      if (!window.confirm('ログアウトしますか?(同じ名前とあいことばで、またログインできます)')) return;
      lsSet(LS_ACCT, ''); lsSet('arcade-name', ''); lsSet('arcade-uid', ''); location.reload();
    });
    a.append(out);
  }
  function acctModal() {
    const back = el('div', 'acct'); back.setAttribute('role', 'dialog'); back.setAttribute('aria-modal', 'true'); back.setAttribute('aria-label', 'アカウント');
    const box = el('div', 'acct-in'); back.append(box);
    let mode = 'new';
    const render = () => {
      box.textContent = '';
      box.append(bt('h2', '', 'ひまつぶしアーケードへようこそ'));
      box.append(bt('p', 'sub', 'ランキングや対戦に使う、あなたのアカウントをつくります。なまえと、4けたの数字(あいことば)だけです。'));
      const tabs = el('div', 'acct-tabs');
      [['new', 'はじめて'], ['login', 'ログイン']].forEach(([m, label]) => {
        const t = bt('button', 'pill', label); t.type = 'button'; t.setAttribute('aria-pressed', String(mode === m));
        t.addEventListener('click', () => { mode = m; render(); }); tabs.append(t);
      });
      box.append(tabs);
      const nm = bt('input', 'bt-sel'); nm.type = 'text'; nm.maxLength = 12; nm.placeholder = 'なまえ(12文字まで)'; nm.autocomplete = 'off'; nm.setAttribute('aria-label', 'なまえ'); nm.value = lsGet('arcade-name');
      const pn = bt('input', 'bt-sel'); pn.type = 'password'; pn.inputMode = 'numeric'; pn.maxLength = 4; pn.placeholder = 'あいことば(数字4けた)'; pn.autocomplete = 'off'; pn.setAttribute('aria-label', 'あいことば');
      const go = bt('button', 'btn', mode === 'new' ? 'アカウントをつくる' : 'ログイン'); go.type = 'button';
      const msg = bt('p', 'bt-msg', '');
      box.append(nm, pn, go, msg);
      if (mode === 'new') box.append(bt('p', 'sub', 'あいことばは、ほかの端末でログインするときに使います。わすれないでね。'));
      go.addEventListener('click', async () => {
        const name = nm.value.trim().slice(0, 12), pin = pn.value;
        if (!name) { msg.textContent = 'なまえを入れてください。'; return; }
        if (!/^\d{4}$/.test(pin)) { msg.textContent = 'あいことばは数字4けたです。'; return; }
        go.disabled = true; msg.textContent = 'かくにん中…';
        const key = nameKey(name);
        try {
          const cur = await rtdb('GET', '/accounts/' + key);
          if (mode === 'new') {
            if (cur) { msg.textContent = 'その名前はすでに使われています。自分の名前なら「ログイン」へ。'; go.disabled = false; return; }
            await rtdb('PUT', '/accounts/' + key, { name: name, pin: pinHash(key, pin), uid: Rank.uid, at: Date.now() });
            lsSet('arcade-name', name); lsSet(LS_ACCT, '1');
            back.remove(); acctLine(); Rank.fetch(tabId);
          } else {
            if (!cur) { msg.textContent = 'その名前のアカウントが見つかりません。'; go.disabled = false; return; }
            if (cur.pin !== pinHash(key, pin)) { msg.textContent = 'あいことばがちがいます。'; go.disabled = false; return; }
            lsSet('arcade-uid', String(cur.uid)); lsSet('arcade-name', String(cur.name)); lsSet(LS_ACCT, '1'); lsSet('arcade-sync', '1');
            location.reload();
          }
        } catch (e) { msg.textContent = '通信できませんでした。もう一度ためしてください。'; go.disabled = false; }
      });
    };
    render(); document.body.append(back);
    try { $('input', box).focus({ preventScroll: true }); } catch (e) {}
  }
  async function acctSync() {
    if (lsGet('arcade-sync') !== '1') return;
    lsSet('arcade-sync', '');
    await Promise.all(GAMES.map(async (g) => {
      try { const d = await rtdb('GET', '/scores/' + g.id + '/' + Rank.uid); if (d && Number(d.score) > (rec[g.id] || 0)) rec[g.id] = Number(d.score); } catch (e) {}
    }));
    saveRec(); renderHome();
  }

  $('#battleBtn').addEventListener('click', () => { battleMenu(); });
  acctLine();
  setView('home');
  renderHome();
  Rank.init();
  acctSync();
  if (!lsGet(LS_ACCT)) acctModal();
})();
</script>

</body>
</html>
