<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{color-scheme:dark}body{margin:0}[hidden]{display:none!important}</style>
<title>ひまつぶしアーケード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  /* 夜空のゲームセンター。上にバー、中央に画面(ホームまたはゲーム)。ゲームは縦長のステージに重ねて表示する。 */
  :root {
    --bg: #0a0c2c;
    --ink: #eef0ff;
    --mute: #a3aae0;
    --gold: #ffd45e;
    --gold-ink: #2b2204;
    --coral: #ff6b81;
    --mint: #6fe3cf;
    --panel: rgba(18, 22, 74, 0.9);
    --line: rgba(160, 170, 255, 0.24);
    --silver: #cfd6ff;
    --bronze: #e8a574;
    --display: 'Dela Gothic One', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
    --body: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    font-weight: 500;
    line-height: 1.6;
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
  h1, h2, h3, h4, p { margin: 0; }

  .top { width: min(100%, 560px); margin-inline: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex: none; min-height: 34px; }
  .top-l { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ttl { font-family: var(--display); font-size: 18px; color: var(--gold); letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--mute); white-space: nowrap; }
  .pill:hover { border-color: var(--gold); color: var(--ink); }
  #snd[aria-pressed="true"] { color: var(--ink); border-color: var(--mint); }

  /* ホーム */
  .home { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  .wrap { width: min(100%, 560px); margin-inline: auto; display: flex; flex-direction: column; gap: 22px; padding-block: 6px 28px; }
  .hero h1 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.25; color: var(--gold); text-wrap: balance; text-shadow: 0 0 26px rgba(255, 212, 94, 0.3); }
  .hero p { color: var(--mute); margin-top: 6px; text-wrap: pretty; }
  .games { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .sec .games { margin-top: 12px; }
  .gcard {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; text-align: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 6px 10px; min-width: 0;
  }
  .gcard:hover { border-color: var(--gold); }
  .gcard svg { width: 52px; height: 52px; flex: none; }
  .gcard .gn { font-family: var(--display); font-size: 13px; line-height: 1.35; text-wrap: balance; overflow-wrap: anywhere; }
  .gcard .gs { margin-top: auto; font-size: 11px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .gcard .gs b { color: var(--ink); }
  .sec h2 { font-family: var(--display); font-weight: 400; font-size: 20px; color: var(--ink); }
  .sec .sub { color: var(--mute); font-size: 13px; margin-top: 2px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .tabs .pill[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 700; }

  ol.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  ol.rank li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(18, 22, 74, 0.55); }
  ol.rank li.me { border-color: var(--mint); background: rgba(111, 227, 207, 0.1); }
  ol.rank .n { font-family: var(--display); font-size: 16px; color: var(--mute); text-align: center; }
  ol.rank li:nth-child(1) .n { color: var(--gold); }
  ol.rank li:nth-child(2) .n { color: var(--silver); }
  ol.rank li:nth-child(3) .n { color: var(--bronze); }
  ol.rank .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ol.rank .sc { font-family: var(--display); font-size: 17px; font-variant-numeric: tabular-nums; }
  .empty { color: var(--mute); font-size: 14px; padding: 14px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; }

  /* ゲーム画面 */
  .play { flex: 1; min-height: 0; display: flex; justify-content: center; }
  .stage {
    position: relative; flex: 0 1 520px; min-width: 0; min-height: 0;
    border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: #080a24;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .gm { position: absolute; inset: 0; }
  .cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .hud { position: absolute; inset: 0 0 auto 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .hud-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .score { display: flex; flex-direction: column; line-height: 1.1; }
  .lbl { font-size: 11px; letter-spacing: 0.12em; color: var(--mute); }
  .num { font-family: var(--display); font-size: 34px; font-variant-numeric: tabular-nums; color: var(--ink); }
  .lives { display: flex; gap: 3px; font-size: 22px; line-height: 1; padding-top: 4px; }
  .lives span { color: var(--coral); }
  .lives span.off { color: rgba(163, 170, 224, 0.28); }
  .chip { font-weight: 700; font-size: 13px; padding: 3px 12px; border-radius: 999px; background: rgba(111, 227, 207, 0.16); color: var(--mint); border: 1px solid rgba(111, 227, 207, 0.4); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip.off { visibility: hidden; }
  .lv { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .lv-track { width: 96px; height: 6px; border-radius: 3px; background: rgba(163, 170, 224, 0.2); overflow: hidden; }
  .lv-track i { display: block; height: 100%; width: 0; background: var(--gold); border-radius: 3px; }
  .lv-track.wide { width: 120px; }
  .lv.time { font-size: 14px; color: var(--ink); }

  .ov { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 20px; background: linear-gradient(rgba(8, 10, 36, 0.8), rgba(8, 10, 36, 0.94)); overflow-y: auto; }
  .ov-in { width: min(100%, 380px); margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
  .ov h2 { font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.2; color: var(--gold); text-wrap: balance; text-shadow: 0 0 24px rgba(255, 212, 94, 0.35); }
  .ov h3 { font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--gold); }
  .ov h4 { font-size: 14px; color: var(--mute); }
  .ov p { color: var(--mute); }
  .how { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; color: var(--ink); font-size: 14px; }
  .legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .legend div { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border: 1px solid var(--line); border-radius: 12px; font-size: 12px; color: var(--mute); text-align: center; }
  .legend svg { width: 30px; height: 30px; }
  .legend b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .legend .bad b { color: var(--coral); }
  .mybest { font-size: 13px; color: var(--mute); }
  .mybest b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .btn { border: 0; border-radius: 14px; padding: 14px 22px; background: var(--gold); color: var(--gold-ink); font-weight: 700; font-size: 17px; box-shadow: 0 6px 0 #b8902a; transition: transform 0.08s, box-shadow 0.08s; }
  .btn:hover { transform: translateY(1px); box-shadow: 0 5px 0 #b8902a; }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #b8902a; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); box-shadow: none; font-size: 15px; padding: 11px 18px; }
  .btn.ghost:hover { border-color: var(--gold); transform: none; box-shadow: none; }
  .btns { display: flex; flex-direction: column; gap: 10px; }

  .cards { display: flex; flex-direction: column; gap: 10px; }
  .card { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 28px minmax(0, 1fr); column-gap: 12px; align-items: center; }
  .card:hover { border-color: var(--gold); }
  .card .k { grid-row: span 2; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--mute); font-size: 13px; font-weight: 700; }
  .card .t { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card .d { color: var(--mute); font-size: 13px; }
  .pips { display: inline-flex; gap: 3px; }
  .pips i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--gold); }
  .pips i.on { background: var(--gold); }
  .hint { font-size: 12px; text-align: center; }

  .res { display: flex; flex-direction: column; gap: 2px; }
  .res .big { font-family: var(--display); font-size: 54px; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .res .rec { color: var(--mint); font-weight: 700; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stats div { border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px; text-align: center; font-size: 12px; color: var(--mute); }
  .stats b { display: block; font-size: 21px; color: var(--ink); font-family: var(--display); font-weight: 400; font-variant-numeric: tabular-nums; }
  .status { font-size: 13px; color: var(--mint); min-height: 1.4em; }
  .rbox { display: flex; flex-direction: column; gap: 6px; }

  /* ほし合体 */
  .mg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; --side: 320px; }
  .mg-hud { width: var(--side); display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .mg-hud .num { font-size: 30px; }
  .mg-board { width: var(--side); height: var(--side); box-sizing: border-box; padding: 6px; background: rgba(20, 24, 80, 0.9); border: 1px solid var(--line); border-radius: 16px; }
  .mg-cells { position: relative; width: 100%; height: 100%; }
  .mg-grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); }
  .mg-grid i { margin: 4px; border-radius: 10px; background: rgba(160, 170, 255, 0.1); }
  .tile { position: absolute; width: 25%; height: 25%; transition: left 0.11s ease, top 0.11s ease; }
  .tile .f { position: absolute; inset: 4px; border-radius: 10px; display: grid; place-items: center; font-family: var(--display); font-size: calc(var(--side) / 9); line-height: 1; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18); }
  .tile .f[data-d="3"] { font-size: calc(var(--side) / 11); }
  .tile .f[data-d="4"], .tile .f[data-d="5"] { font-size: calc(var(--side) / 14); }
  .tile .f.new { animation: born 0.16s ease-out; }
  .tile .f.pop { animation: pop 0.16s ease-out; }
  @keyframes born { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .mg-foot { width: var(--side); display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--mute); font-size: 12px; }
  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } .tile .f.new, .tile .f.pop { animation: none; } }

  /* ひかりの順番 */
  .sm { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; --side: 320px; }
  .sm-msg { width: var(--side); min-height: 1.7em; text-align: center; color: var(--ink); font-weight: 700; font-size: 16px; }
  .sm-pads { width: var(--side); height: var(--side); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pad { border: 0; padding: 0; border-radius: 22px; background: var(--d); display: grid; place-items: center; transition: background 0.06s, box-shadow 0.06s, transform 0.06s; }
  .pad svg { width: 38%; height: 38%; fill: rgba(255, 255, 255, 0.3); }
  .pad.on { background: var(--c); box-shadow: 0 0 38px var(--c); transform: scale(0.97); }
  .pad.on svg { fill: #ffffff; }
  @media (prefers-reduced-motion: reduce) { .pad { transition: none; } }

  /* めくりペア */
  .pg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; --gw: 340px; --cs: 70px; }
  .pg-hud, .pg-sub, .pg-foot { width: var(--gw); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .pg-hud { align-items: flex-end; }
  .pg-hud .num { font-size: 30px; }
  .pg-time { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .pg-sub { font-size: 13px; color: var(--mute); min-height: 28px; }
  .pg-foot { color: var(--mint); font-size: 13px; font-weight: 700; min-height: 30px; }
  .pg-grid { display: grid; grid-template-columns: repeat(4, var(--cs)); gap: 8px; }
  .pc {
    width: var(--cs); height: var(--cs); padding: 0; border-radius: 12px; border: 1px solid var(--line);
    background: linear-gradient(150deg, #2f37a0, #1b2070); position: relative; display: grid; place-items: center;
    transition: background 0.12s, opacity 0.2s;
  }
  .pc .bk { width: 46%; height: 46%; }
  .pc .fr { display: none; width: 62%; height: 62%; }
  .pc.up { background: #232a86; border-color: var(--mint); }
  .pc.up .bk { display: none; }
  .pc.up .fr { display: block; animation: flipin 0.16s ease-out; }
  .pc.done { opacity: 0.3; pointer-events: none; border-color: transparent; }
  @keyframes flipin { from { transform: scaleX(0.1); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .pc { transition: none; } .pc.up .fr { animation: none; } }

  /* ナンバータッチ */
  .ng-grid { display: grid; grid-template-columns: repeat(var(--cols, 3), var(--cs)); gap: 8px; }
  .nc {
    width: var(--cs); height: var(--cs); padding: 0; border-radius: 12px; border: 1px solid var(--line);
    background: linear-gradient(150deg, #2f37a0, #1d2377); color: var(--ink);
    font-family: var(--display); font-size: calc(var(--cs) * 0.4); line-height: 1; font-variant-numeric: tabular-nums;
    transition: opacity 0.2s, background 0.12s;
  }
  .nc:hover { border-color: var(--gold); }
  .nc.done { opacity: 0.22; pointer-events: none; border-color: transparent; }
  .nc.bad { background: rgba(255, 107, 129, 0.35); border-color: var(--coral); animation: nshake 0.25s; }
  @keyframes nshake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  @media (prefers-reduced-motion: reduce) { .nc { transition: none; } .nc.bad { animation: none; } }

  /* 4択クイズ(さんすうダッシュ・いろあて) */
  .qz { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
  .qz > * { width: min(100%, 360px); }
  .qz-hud { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .qz-hud .num { font-size: 30px; }
  .qz-q { min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border: 1px solid var(--line); border-radius: 18px; background: rgba(18, 22, 74, 0.7); text-align: center; padding: 12px; }
  .qz-q .big { font-family: var(--display); font-size: 52px; line-height: 1.15; font-variant-numeric: tabular-nums; max-width: 100%; overflow-wrap: anywhere; }
  .qz-q .sub { color: var(--mute); font-size: 18px; }
  .tag { font-size: 13px; font-weight: 700; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--line); }
  .t-ink { background: rgba(111, 227, 207, 0.16); color: var(--mint); border-color: rgba(111, 227, 207, 0.4); }
  .t-read { background: rgba(255, 212, 94, 0.16); color: var(--gold); border-color: rgba(255, 212, 94, 0.4); }
  .qz-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .qo { position: relative; border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 16px 8px; font-family: var(--display); font-size: 24px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .qo .kk { position: absolute; left: 8px; top: 6px; font-family: var(--body); font-size: 11px; color: var(--mute); }
  .qo:hover { border-color: var(--gold); }
  .qo.ok { background: rgba(111, 227, 207, 0.25); border-color: var(--mint); }
  .qo.ng { background: rgba(255, 107, 129, 0.25); border-color: var(--coral); }
  .qz-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 30px; }
  .qz-msg { flex: 1; min-width: 0; color: var(--mint); font-size: 13px; font-weight: 700; }


  /* ライトオフ・ちがうのどれ */
  .lc {
    width: var(--cs); height: var(--cs); padding: 0; border-radius: 12px; border: 1px solid var(--line);
    background: #1b2070; transition: background 0.12s, box-shadow 0.12s;
  }
  .lc:hover { border-color: var(--gold); }
  .lc.on { background: linear-gradient(150deg, #ffe58a, #f2b72e); border-color: #ffe58a; box-shadow: 0 0 16px rgba(255, 212, 94, 0.55); }
  .oc { width: var(--cs); height: var(--cs); padding: 0; border-radius: 10px; border: 0; }
  .oc:hover { outline: 2px solid rgba(255, 255, 255, 0.5); outline-offset: 1px; }
  .oc.bad { animation: nshake 0.25s; outline: 3px solid var(--coral); outline-offset: 1px; }
  .oc.hint { outline: 3px solid var(--mint); outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) { .lc { transition: none; } .oc.bad { animation: none; } }

  /* 一覧の絞り込み・ひと休みの2つ目のボタン */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .filters .pill[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 700; }
  .gcard .gs.new { color: var(--mint); font-weight: 700; }
  button, .gcard, .pill { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

  .top-r { display: flex; align-items: center; gap: 8px; }

  @media (max-height: 560px) {
    .ov h2 { font-size: 26px; }
    .legend, .how { display: none; }
  }

  /* もぐらたたき */
  .mc { width: var(--cs); height: var(--cs); padding: 0; border-radius: 50%; border: 1px solid var(--line); background: radial-gradient(circle at 50% 75%, #0a0d33, #1b2070); display: grid; place-items: center; font-size: calc(var(--cs) * 0.52); line-height: 1; overflow: hidden; transition: background 0.12s, box-shadow 0.12s; }
  .mc span { transform: translateY(120%); transition: transform 0.09s ease-out; pointer-events: none; }
  .mc.up span { transform: none; }
  .qo .tx { white-space: pre-line; }
  .mc.gold { border-color: var(--gold); box-shadow: 0 0 14px rgba(255, 212, 94, 0.5); }
  .mc.bomb { border-color: var(--coral); }
  .mc.hit { background: rgba(111, 227, 207, 0.35); }
  .mc.boom { background: rgba(255, 107, 129, 0.45); animation: nshake 0.25s; }
  /* はんのうテスト */
  .rx { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
  .rx > * { width: min(100%, 360px); }
  .rx .pg-hud { align-items: flex-end; }
  .rx-pad { height: min(42vh, 300px); border-radius: 22px; border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #fff; padding: 16px; text-align: center; transition: background 0.08s; user-select: none; -webkit-user-select: none; }
  .rx-pad .rx-t { font-family: var(--display); font-size: 30px; line-height: 1.2; }
  .rx-pad .rx-s { font-size: 14px; opacity: 0.85; }
  .rx-pad.idle { background: #232a86; }
  .rx-pad.wait { background: #8a2740; }
  .rx-pad.go { background: #1f9a62; border-color: #9af0c4; }

  .battle-btn { margin-top: 14px; }
  .bt-card { border: 1px solid var(--line); border-radius: 16px; background: rgba(18, 22, 74, 0.7); padding: 14px; margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }

  .bt-in { text-transform: uppercase; letter-spacing: 0.3em; text-align: center; font-family: var(--display); font-size: 24px; }
  .bt-code { font-family: var(--display); font-size: 56px; letter-spacing: 0.25em; color: var(--gold); text-align: center; margin: 4px 0; }
  .bt-me, .bt-msg { color: var(--mint); font-size: 13px; font-weight: 700; margin: 10px 0 0; min-height: 18px; }
  .bt-pl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

  .bt-r.me { border-color: var(--mint); }
  .bt-r b { font-family: var(--display); font-size: 22px; }

  .bt-warn { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); z-index: 60; background: rgba(200, 30, 60, 0.94); color: #fff; font-family: var(--display); font-size: 24px; line-height: 1.35; text-align: center; white-space: pre-line; padding: 12px 22px; border-radius: 16px; border: 3px solid #fff; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5); pointer-events: none; animation: btwarn 0.5s ease-out; }

<script>
(() => {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const FONT = '"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';

  /* ===== 音 ===== */
  const A = {
    ac: null, muted: false,
    unlock() {
      if (!this.ac) { try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ac = null; } }
      if (this.ac && this.ac.state === 'suspended') this.ac.resume().catch(() => {});
    },
    beep(f, d, type, v, slide, delay) {
      if (!this.ac || this.muted) return;
      if (type === 'sawtooth') { try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {} }
      try {
        const t0 = this.ac.currentTime + (delay || 0);
        const o = this.ac.createOscillator(), g = this.ac.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(f, t0);
        if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t0 + d);
        g.gain.setValueAtTime(v || 0.06, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
        o.connect(g); g.connect(this.ac.destination);
        o.start(t0); o.stop(t0 + d + 0.02);
      } catch (e) {}
    }
  };
  const SCALE = [523, 587, 659, 784, 880, 1047, 1175, 1319];

  /* ===== 夜空 ===== */
  const SKY = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), r: 0.4 + Math.random() * 1.2, sp: 0.8 + Math.random() * 2, ph: Math.random() * 6.28 }));
  function drawSky(ctx, W, H, time, hills) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#080a24'); g.addColorStop(0.65, '#171c58'); g.addColorStop(1, '#2b2f78');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#dfe4ff';
    for (const b of SKY) {
      ctx.globalAlpha = 0.3 + 0.45 * (0.5 + 0.5 * Math.sin(time * b.sp + b.ph));
      ctx.beginPath(); ctx.arc(b.x * W, b.y * H * 0.88, b.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (!hills) return;
    ctx.fillStyle = '#10134a';
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 12; x += 12) ctx.lineTo(x, H - 46 - Math.sin(x * 0.012 + 1) * 16 - Math.sin(x * 0.031) * 6);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#0a0c2e';
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 12; x += 12) ctx.lineTo(x, H - 22 - Math.sin(x * 0.02 + 3) * 10);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }
  function starPath(ctx, x, y, r, rot) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.48 : r;
      if (i) ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); else ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
  }
  function spikePath(ctx, x, y, r, rot) {
    ctx.beginPath();
    for (let i = 0; i < 12; i++) {
      const a = rot + i * Math.PI / 6, rr = i % 2 ? r * 0.5 : r;
      if (i) ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); else ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
  }
  function fitCanvas(cv, ctx, stage) {
    const r = stage.getBoundingClientRect();
    const W = Math.max(240, r.width), H = Math.max(320, r.height);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { W, H };
  }
  const burstTo = (arr, x, y, c, n, sp) => {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.283, v = (sp || 120) * (0.3 + Math.random());
      arr.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: 0, max: 0.5 + Math.random() * 0.3, c, r: 1.5 + Math.random() * 2 });
    }
  };
  function stepParts(parts, dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life += dt; p.vy += 300 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.life >= p.max) parts.splice(i, 1);
    }
  }
  function drawParts(ctx, parts) {
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, 1 - p.life / p.max);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function stepPops(pops, dt) {
    for (let i = pops.length - 1; i >= 0; i--) { const p = pops[i]; p.life += dt; p.y -= 34 * dt; if (p.life >= 0.8) pops.splice(i, 1); }
  }
  function drawPops(ctx, pops) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of pops) {
      ctx.globalAlpha = Math.max(0, 1 - p.life / 0.8);
      ctx.font = '700 ' + p.size + 'px ' + FONT;
      ctx.fillStyle = p.c;
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  /* ===== ゲーム1: 星ひろい ===== */
  const STAR_UPG = [
    { id: 'wide',   name: 'ひろいカゴ',   desc: 'カゴの幅が25%ひろがる', max: 3 },
    { id: 'magnet', name: '星のじしゃく', desc: '近くの星や月を引きよせる', max: 3 },
    { id: 'slow',   name: 'ゆっくり星',   desc: '落ちる速さが12%おそくなる', max: 3 },
    { id: 'life',   name: 'ハート',       desc: 'ライフが1つ増える(最大5)', max: 3, ok: (s) => s.lives < 5 },
    { id: 'score',  name: 'きらめき',     desc: '得点が25%アップ', max: 4 },
    { id: 'safe',   name: 'かけらよけ',   desc: '赤いかけらが出にくくなる', max: 3 },
    { id: 'step',   name: 'コンボの階段', desc: '少ないコンボで倍率が上がる', max: 2 },
    { id: 'moon',   name: '月のよび声',   desc: '月(50点)が出やすくなる', max: 2 }
  ];

  function createStar(stage, api) {
    const root = el('div', 'gm', `
      <canvas class="cv" aria-label="星ひろいのゲーム画面"></canvas>
      <div class="hud">
        <div class="hud-row">
          <div class="score"><span class="lbl">スコア</span><span class="num" data-k="score">0</span></div>
          <div class="lives" data-k="lives" aria-label="のこりライフ"></div>
        </div>
        <div class="hud-row">
          <span class="chip off" data-k="combo">0 コンボ ×1</span>
          <div class="lv"><span data-k="lvTxt">Lv 1</span><div class="lv-track"><i data-k="lvFill"></i></div></div>
        </div>
      </div>
      <section class="ov" data-k="ovUp" hidden>
        <div class="ov-in">
          <h3 data-k="upTitle">レベルアップ</h3>
          <div class="cards" data-k="cards"></div>
          <p class="hint">1 2 3 キーでも選べます</p>
        </div>
      </section>`);
    stage.append(root);
    const k = (n) => root.querySelector('[data-k="' + n + '"]');
    const cv = $('canvas', root), ctx = cv.getContext('2d');
    let W = 360, H = 600, raf = 0, last = 0;
    let S = null;
    const input = { l: false, r: false };
    const cache = {};

    const needFor = (lv) => 12 + lv * 6;
    function makeState(mode) {
      return {
        mode, t: 0, score: 0, combo: 0, maxCombo: 0, caught: 0, level: 1, prog: 0, need: needFor(1),
        lives: 3, inv: 0, spawn: 0.5, items: [], parts: [], pops: [], shake: 0, flash: 0,
        px: S ? S.px : W / 2, tx: S ? S.tx : W / 2,
        up: { wide: 0, magnet: 0, slow: 0, life: 0, score: 0, safe: 0, step: 0, moon: 0 }, choices: []
      };
    }
    const getPw = () => Math.min(W * 0.55, Math.max(72, Math.min(96, W * 0.22)) * Math.pow(1.25, S.up.wide));
    const getStep = () => 5 - S.up.step;
    const getMult = () => Math.min(9, 1 + Math.floor(S.combo / getStep()));
    const PY = () => H - 80;
    const pop = (x, y, text, c, size) => S.pops.push({ x, y, text, c, size: size || 16, life: 0 });

    function resize() {
      const r = stage.getBoundingClientRect();
      if (S && W) { S.px *= Math.max(240, r.width) / W; S.tx *= Math.max(240, r.width) / W; }
      const d = fitCanvas(cv, ctx, stage); W = d.W; H = d.H;
    }

    function spawnItem() {
      const t = S.t, up = S.up;
      const shardP = Math.min(0.12 + t * 0.0016, 0.3) * Math.pow(0.8, up.safe);
      const moonP = Math.min(0.05 * (1 + up.moon), 0.2);
      const r = Math.random();
      let type = 'star';
      if (r < shardP) type = 'shard';
      else if (r < shardP + moonP) type = 'moon';
      else if (r < shardP + moonP + 0.08) type = 'comet';
      const base = (130 + Math.min(t * 2.4, 230)) * Math.pow(0.88, up.slow);
      const spec = { star: { r: 11, m: 0.9 + Math.random() * 0.3 }, moon: { r: 17, m: 0.7 }, comet: { r: 9, m: 1.9 }, shard: { r: 12, m: 1.05 } }[type];
      S.items.push({ type, r: spec.r, x: 24 + Math.random() * (W - 48), y: -24, vy: base * spec.m, rot: Math.random() * 6.28, ph: Math.random() * 6.28 });
    }

    function catchGood(it) {
      const before = getMult();
      S.combo++;
      if (S.combo > S.maxCombo) S.maxCombo = S.combo;
      const mult = getMult();
      const pts = Math.round({ star: 10, moon: 50, comet: 30 }[it.type] * mult * (1 + 0.25 * S.up.score));
      S.score += pts; S.caught++;
      S.prog += it.type === 'moon' ? 3 : 1;
      const col = it.type === 'star' ? '#ffd45e' : it.type === 'moon' ? '#eef0ff' : '#8fe9ff';
      burstTo(S.parts, it.x, PY(), col, it.type === 'moon' ? 16 : 8, 130);
      pop(it.x, PY() - 20, '+' + pts, col, it.type === 'moon' ? 20 : 15);
      if (mult > before) pop(S.px, PY() - 52, '×' + mult + '!', '#6fe3cf', 22);
      A.beep(SCALE[S.combo % 8] * (S.combo >= 16 ? 2 : 1), 0.12, 'sine', 0.06);
    }
    function hitShard(it) {
      if (S.inv > 0) return;
      S.lives--; S.combo = 0; S.inv = 1.3; S.shake = 0.4; S.flash = 1;
      burstTo(S.parts, it.x, PY(), '#ff6b81', 14, 170);
      A.beep(180, 0.3, 'sawtooth', 0.07, -110);
      if (S.lives <= 0) endGame();
    }

    function update(dt) {
      S.t += dt;
      if (input.l) S.tx -= 560 * dt;
      if (input.r) S.tx += 560 * dt;
      S.tx = Math.max(0, Math.min(W, S.tx));
      S.px += (S.tx - S.px) * Math.min(1, dt * 18);
      S.spawn -= dt;
      if (S.spawn <= 0) { spawnItem(); S.spawn += Math.max(0.26, 0.72 - S.t * 0.004) * (0.85 + Math.random() * 0.3); }
      const pw = getPw(), py = PY(), magR = S.up.magnet * 80;
      for (let i = S.items.length - 1; i >= 0; i--) {
        const it = S.items[i];
        it.y += it.vy * dt;
        it.rot += dt * (it.type === 'shard' ? -2.2 : 1.6);
        if (it.type === 'star' || it.type === 'moon') it.x += Math.sin(S.t * 2 + it.ph) * 14 * dt;
        if (magR && it.type !== 'shard') {
          const dx = S.px - it.x, dy = py - it.y;
          if (Math.hypot(dx, dy) < magR + pw * 0.4) it.x += Math.sign(dx) * Math.min(Math.abs(dx), 240 * dt);
        }
        if (it.y + it.r * 0.6 >= py && it.y - it.r <= py + 22 && Math.abs(it.x - S.px) <= pw / 2 + it.r * 0.5) {
          S.items.splice(i, 1);
          if (it.type === 'shard') hitShard(it); else catchGood(it);
          if (S.mode !== 'play') return;
          continue;
        }
        if (it.y - it.r > H + 10) {
          S.items.splice(i, 1);
          if (it.type === 'star' && S.combo > 0) {
            if (S.combo >= getStep()) pop(it.x, H - 100, 'コンボ切れ', '#a3aae0', 14);
            S.combo = 0;
          }
        }
      }
      S.inv = Math.max(0, S.inv - dt); S.shake = Math.max(0, S.shake - dt); S.flash = Math.max(0, S.flash - dt * 2.5);
      stepParts(S.parts, dt); stepPops(S.pops, dt);
      if (S.prog >= S.need) levelUp();
    }

    function drawItem(it) {
      const { x, y, r } = it;
      ctx.save();
      if (it.type === 'star') {
        ctx.shadowColor = '#ffd45e'; ctx.shadowBlur = 14;
        starPath(ctx, x, y, r, it.rot); ctx.fillStyle = '#ffd45e'; ctx.fill();
      } else if (it.type === 'moon') {
        ctx.shadowColor = '#c9d0ff'; ctx.shadowBlur = 18;
        ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fillStyle = '#eef0ff'; ctx.fill();
        ctx.shadowBlur = 0; ctx.fillStyle = '#c3c8f0';
        ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.25, r * 0.22, 0, 6.283); ctx.fill();
        ctx.beginPath(); ctx.arc(x + r * 0.28, y + r * 0.3, r * 0.28, 0, 6.283); ctx.fill();
      } else if (it.type === 'comet') {
        const tl = 52, g = ctx.createLinearGradient(x, y - tl, x, y);
        g.addColorStop(0, 'rgba(143,233,255,0)'); g.addColorStop(1, 'rgba(143,233,255,0.9)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(x - r * 0.8, y); ctx.lineTo(x, y - tl); ctx.lineTo(x + r * 0.8, y); ctx.closePath(); ctx.fill();
        ctx.shadowColor = '#8fe9ff'; ctx.shadowBlur = 16;
        ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fillStyle = '#ffffff'; ctx.fill();
      } else {
        const pulse = 1 + 0.08 * Math.sin(S.t * 10 + it.ph);
        ctx.shadowColor = '#ff6b81'; ctx.shadowBlur = 12;
        spikePath(ctx, x, y, r * pulse, it.rot); ctx.fillStyle = '#ff6b81'; ctx.fill();
        ctx.shadowBlur = 0; ctx.fillStyle = '#3a0f2a';
        ctx.beginPath(); ctx.moveTo(x, y - r * 0.4); ctx.lineTo(x + r * 0.4, y); ctx.lineTo(x, y + r * 0.4); ctx.lineTo(x - r * 0.4, y); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
    function drawPlayer() {
      const pw = getPw(), x = S.px, y = PY(), h = 22;
      if (S.inv > 0 && Math.floor(S.inv * 14) % 2 === 0) ctx.globalAlpha = 0.45;
      const gl = ctx.createRadialGradient(x, y, 4, x, y, pw * 0.8);
      gl.addColorStop(0, 'rgba(111,227,207,0.35)'); gl.addColorStop(1, 'rgba(111,227,207,0)');
      ctx.fillStyle = gl; ctx.fillRect(x - pw, y - pw, pw * 2, pw * 1.6);
      ctx.beginPath();
      ctx.moveTo(x - pw / 2, y); ctx.lineTo(x + pw / 2, y); ctx.lineTo(x + pw * 0.36, y + h * 1.35);
      ctx.quadraticCurveTo(x, y + h * 1.65, x - pw * 0.36, y + h * 1.35); ctx.closePath();
      const bg = ctx.createLinearGradient(0, y, 0, y + h * 1.5);
      bg.addColorStop(0, '#8ff0de'); bg.addColorStop(1, '#2fa89a');
      ctx.fillStyle = bg; ctx.fill();
      ctx.strokeStyle = 'rgba(8,50,60,0.35)'; ctx.lineWidth = 1.5;
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(x + i * pw * 0.2, y + 3); ctx.lineTo(x + i * pw * 0.15, y + h * 1.4); ctx.stroke(); }
      ctx.strokeStyle = '#d9fff7'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x - pw / 2, y); ctx.lineTo(x + pw / 2, y); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    function draw(time) {
      ctx.save();
      if (S.shake > 0 && !reduce) ctx.translate((Math.random() - 0.5) * S.shake * 18, (Math.random() - 0.5) * S.shake * 18);
      drawSky(ctx, W, H, time, true);
      for (const it of S.items) drawItem(it);
      drawParts(ctx, S.parts);
      drawPlayer();
      drawPops(ctx, S.pops);
      ctx.restore();
      if (S.flash > 0 && !reduce) { ctx.fillStyle = 'rgba(255,107,129,' + (S.flash * 0.28) + ')'; ctx.fillRect(0, 0, W, H); }
    }

    function setText(key, v) { if (cache[key] !== v) { cache[key] = v; k(key).textContent = v; } }
    function hud() {
      setText('score', String(S.score));
      setText('lvTxt', 'Lv ' + S.level);
      const w = Math.min(100, (S.prog / S.need) * 100).toFixed(1) + '%';
      if (cache.w !== w) { cache.w = w; k('lvFill').style.width = w; }
      setText('combo', S.combo + ' コンボ ×' + getMult());
      const sc = S.combo >= 2;
      if (cache.cs !== sc) { cache.cs = sc; k('combo').classList.toggle('off', !sc); }
      const lk = S.lives + '/' + Math.max(3, S.lives);
      if (cache.lk !== lk) {
        cache.lk = lk;
        let html = '';
        for (let i = 0; i < Math.max(3, S.lives); i++) html += '<span class="' + (i < S.lives ? '' : 'off') + '">♥</span>';
        k('lives').innerHTML = html;
      }
    }

    function endGame() {
      S.mode = 'over';
      [523, 440, 349, 262].forEach((f, i) => A.beep(f, 0.25, 'triangle', 0.06, 0, i * 0.14));
      api.end(S.score, [['ひろった数', S.caught], ['最大コンボ', S.maxCombo], ['レベル', S.level]]);
    }
    function levelUp() {
      S.mode = 'levelup';
      const pool = STAR_UPG.filter((u) => S.up[u.id] < u.max && (!u.ok || u.ok(S)));
      for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
      S.choices = pool.slice(0, 3);
      if (!S.choices.length) { S.level++; S.need = needFor(S.level); S.prog = 0; S.mode = 'play'; return; }
      k('upTitle').textContent = 'レベル ' + (S.level + 1) + ' になりました';
      k('cards').innerHTML = S.choices.map((u, i) => {
        let pips = '';
        for (let n = 0; n < u.max; n++) pips += '<i class="' + (n < S.up[u.id] ? 'on' : '') + '"></i>';
        return '<button class="card" type="button" data-i="' + i + '"><span class="k">' + (i + 1) + '</span><span class="t">' + u.name + '<span class="pips" aria-hidden="true">' + pips + '</span></span><span class="d">' + u.desc + '</span></button>';
      }).join('');
      [523, 659, 784, 1047].forEach((f, i) => A.beep(f, 0.18, 'triangle', 0.06, 0, i * 0.08));
      k('ovUp').hidden = false;
      const first = k('cards').querySelector('button');
      if (first) { try { first.focus({ preventScroll: true }); } catch (e) {} }
    }
    function choose(i) {
      if (S.mode !== 'levelup' || !S.choices[i]) return;
      const u = S.choices[i];
      S.up[u.id]++;
      if (u.id === 'life') S.lives = Math.min(5, S.lives + 1);
      S.level++; S.need = needFor(S.level); S.prog = 0; S.inv = Math.max(S.inv, 1); S.mode = 'play';
      k('ovUp').hidden = true;
    }

    const onMove = (e) => { const r = stage.getBoundingClientRect(); S.tx = Math.max(0, Math.min(W, e.clientX - r.left)); };
    const onKeyDown = (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { input.l = true; e.preventDefault(); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { input.r = true; e.preventDefault(); }
      else if (S.mode === 'levelup') { const m = /^(?:Digit|Numpad)([1-3])$/.exec(e.code); if (m) choose(parseInt(m[1], 10) - 1); }
    };
    const onKeyUp = (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.l = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') input.r = false;
    };
    const onCards = (e) => { const b = e.target.closest('button[data-i]'); if (b) choose(parseInt(b.dataset.i, 10)); };
    stage.addEventListener('pointermove', onMove);
    stage.addEventListener('pointerdown', onMove);
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    k('cards').addEventListener('click', onCards);

    function frame(ts) {
      const dt = Math.min(0.05, (ts - last) / 1000 || 0) * DT();
      last = ts;
      if (S.mode === 'play') update(dt);
      draw(ts / 1000);
      hud();
      raf = requestAnimationFrame(frame);
    }
    resize();
    S = makeState('idle');
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(resize) : null;
    if (ro) ro.observe(stage);
    raf = requestAnimationFrame(frame);

    return {
      start() { S = makeState('play'); Object.keys(cache).forEach((n) => delete cache[n]); k('ovUp').hidden = true; },
      pause() { if (S.mode === 'play') S.mode = 'paused'; },
      resume() { if (S.mode === 'paused') S.mode = 'play'; },
      destroy() {
        cancelAnimationFrame(raf); if (ro) ro.disconnect();
        stage.removeEventListener('pointermove', onMove); stage.removeEventListener('pointerdown', onMove);
        window.removeEventListener('keydown', onKeyDown); window.removeEventListener('keyup', onKeyUp);
      }
    };
  }

  /* ===== ゲーム2: ほし合体 ===== */
  const PAL = [
    ['#3a3f9e', '#fff'], ['#4a4fc0', '#fff'], ['#6a5fe0', '#fff'], ['#8a62e8', '#fff'], ['#b068e6', '#fff'], ['#e070c8', '#fff'],
    ['#ff7fa0', '#2a0f2a'], ['#ff9a66', '#2a1408'], ['#ffb84d', '#2b1c04'], ['#ffd45e', '#2b2204'], ['#fff0a0', '#2b2204']
  ];

  function createMerge(stage, api) {
    const root = el('div', 'mg', `
      <div class="mg-hud">
        <div class="score"><span class="lbl">スコア</span><span class="num" data-k="score">0</span></div>
        <div class="score" style="align-items:flex-end"><span class="lbl">ベスト</span><span class="num" style="font-size:20px" data-k="best">0</span></div>
      </div>
      <div class="mg-board" data-k="board"><div class="mg-cells" data-k="cells"><div class="mg-grid">${'<i></i>'.repeat(16)}</div></div></div>
      <div class="mg-foot"><span>スワイプか矢印キーで動かす</span><button class="pill" type="button" data-k="quit">おわる</button></div>`);
    stage.append(root);
    const k = (n) => root.querySelector('[data-k="' + n + '"]');
    const cells = k('cells');
    let tiles = [], nid = 0, score = 0, moves = 0, locked = true, over = true, quitArm = 0, timers = [];
    const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };

    function size() {
      const side = Math.max(200, Math.min(440, stage.clientWidth - 32, stage.clientHeight - 170));
      root.style.setProperty('--side', side + 'px');
    }
    function place(t) { t.el.style.left = t.c * 25 + '%'; t.el.style.top = t.r * 25 + '%'; }
    function face(t) {
      const idx = Math.min(Math.log2(t.v) - 1, PAL.length - 1);
      t.f.textContent = t.v;
      t.f.style.background = PAL[idx][0]; t.f.style.color = PAL[idx][1];
      t.f.dataset.d = String(String(t.v).length);
    }
    function retrig(node, cls) { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }
    function addTile(r, c, v, cls) {
      const t = { id: nid++, r, c, v, dead: false, merged: false, target: null, el: el('div', 'tile'), f: el('div', 'f') };
      t.el.append(t.f); place(t); face(t);
      if (cls) t.f.classList.add(cls);
      cells.append(t.el); tiles.push(t);
      return t;
    }
    function spawn() {
      const used = new Set(tiles.map((t) => t.r * 4 + t.c)), free = [];
      for (let i = 0; i < 16; i++) if (!used.has(i)) free.push(i);
      if (!free.length) return;
      const p = free[Math.floor(Math.random() * free.length)];
      addTile(Math.floor(p / 4), p % 4, Math.random() < 0.9 ? 2 : 4, reduce ? '' : 'new');
    }
    function canMove() {
      if (tiles.length < 16) return true;
      const g = {};
      tiles.forEach((t) => { g[t.r + ',' + t.c] = t.v; });
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
        const v = g[r + ',' + c];
        if (c < 3 && g[r + ',' + (c + 1)] === v) return true;
        if (r < 3 && g[(r + 1) + ',' + c] === v) return true;
      }
      return false;
    }
    function hudUpdate() { k('score').textContent = String(score); k('best').textContent = String(Math.max(score, api.best())); }

    function move(dir) { // 0=左 1=上 2=右 3=下
      if (locked || over) return;
      const horiz = dir === 0 || dir === 2, rev = dir === 2 || dir === 3;
      tiles.forEach((t) => { t.merged = false; t.target = null; });
      let moved = false, gain = 0, topMerge = 0;
      for (let i = 0; i < 4; i++) {
        const line = tiles.filter((t) => !t.dead && (horiz ? t.r === i : t.c === i))
          .sort((a, b) => { const ka = horiz ? a.c : a.r, kb = horiz ? b.c : b.r; return rev ? kb - ka : ka - kb; });
        let pos = 0, lastT = null;
        for (const t of line) {
          if (lastT && lastT.v === t.v && !lastT.merged) {
            t.target = lastT; lastT.merged = true;
            t.r = lastT.r; t.c = lastT.c;
            gain += lastT.v * 2; topMerge = Math.max(topMerge, lastT.v * 2);
            moved = true;
          } else {
            const p = rev ? 3 - pos : pos, nr = horiz ? i : p, nc = horiz ? p : i;
            if (nr !== t.r || nc !== t.c) moved = true;
            t.r = nr; t.c = nc; pos++; lastT = t; t.merged = false;
          }
        }
      }
      if (!moved) return;
      moves++; locked = true;
      tiles.forEach(place);
      score += gain; hudUpdate();
      later(() => {
        for (const t of tiles) {
          if (t.target) { t.target.v *= 2; face(t.target); retrig(t.target.f, 'pop'); t.el.remove(); t.dead = true; }
        }
        tiles = tiles.filter((t) => !t.dead);
        if (topMerge) { const lv = Math.min(Math.log2(topMerge), 12); A.beep(330 + lv * 60, 0.14, 'sine', 0.07); }
        else A.beep(260, 0.04, 'sine', 0.03);
        spawn();
        locked = false;
        if (!canMove()) { over = true; later(finish, 450); }
      }, reduce ? 0 : 120);
    }
    function finish() {
      if (api.ended()) return;
      over = true;
      const mx = tiles.reduce((m, t) => Math.max(m, t.v), 0);
      [523, 440, 349, 262].forEach((f, i) => A.beep(f, 0.25, 'triangle', 0.06, 0, i * 0.14));
      api.end(score, [['最大タイル', mx || 0], ['手数', moves], ['ベスト', Math.max(score, api.best())]]);
    }

    let sx = 0, sy = 0, tracking = false;
    const onDown = (e) => { if (e.target.closest('button')) return; sx = e.clientX; sy = e.clientY; tracking = true; };
    const onUp = (e) => {
      if (!tracking) return; tracking = false;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      if (Math.abs(dx) > Math.abs(dy)) move(dx < 0 ? 0 : 2); else move(dy < 0 ? 1 : 3);
    };
    const onKey = (e) => {
      const m = { ArrowLeft: 0, KeyA: 0, ArrowUp: 1, KeyW: 1, ArrowRight: 2, KeyD: 2, ArrowDown: 3, KeyS: 3 }[e.code];
      if (m != null) { e.preventDefault(); move(m); }
    };
    const onQuit = () => {
      if (over) return;
      if (!quitArm) {
        k('quit').textContent = '本当におわる?';
        quitArm = setTimeout(() => { quitArm = 0; k('quit').textContent = 'おわる'; }, 2500);
        timers.push(quitArm);
      } else { clearTimeout(quitArm); quitArm = 0; k('quit').textContent = 'おわる'; finish(); }
    };
    stage.addEventListener('pointerdown', onDown);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('keydown', onKey);
    k('quit').addEventListener('click', onQuit);
    size();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(size) : null;
    if (ro) ro.observe(stage);
    hudUpdate();
    // 開始前の見た目用に盤面を出しておく
    addTile(1, 1, 2); addTile(2, 2, 4);

    return {
      start() {
        timers.forEach(clearTimeout); timers = [];
        cells.querySelectorAll('.tile').forEach((n) => n.remove());
        tiles = []; nid = 0; score = 0; moves = 0; over = false; locked = false; quitArm = 0;
        k('quit').textContent = 'おわる';
        spawn(); spawn(); hudUpdate();
      },
      pause() {}, resume() {},
      destroy() {
        timers.forEach(clearTimeout); if (ro) ro.disconnect();
        stage.removeEventListener('pointerdown', onDown);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('keydown', onKey);
      }
    };
  }

  /* ===== ゲーム3: ぷちタップ ===== */
  function createTap(stage, api) {
    const root = el('div', 'gm', `
      <canvas class="cv" aria-label="ぷちタップのゲーム画面"></canvas>
      <div class="hud">
        <div class="hud-row">
          <div class="score"><span class="lbl">スコア</span><span class="num" data-k="score">0</span></div>
          <div class="lv time"><span data-k="tm">45</span><div class="lv-track wide"><i data-k="tFill" style="width:100%"></i></div></div>
        </div>
        <div class="hud-row"><span class="chip off" data-k="combo">0 コンボ ×1</span></div>
      </div>`);
    stage.append(root);
    const k = (n) => root.querySelector('[data-k="' + n + '"]');
    const cv = $('canvas', root), ctx = cv.getContext('2d');
    const TOTAL = 45, TMAX = 60;
    let W = 360, H = 600, raf = 0, last = 0, S = null;
    const cache = {};
    const R = () => Math.max(26, Math.min(38, W * 0.1));
    const makeState = (mode) => ({ mode, t: 0, time: TOTAL, score: 0, combo: 0, maxCombo: 0, hits: 0, taps: 0, spawn: 0.4, bubbles: [], parts: [], pops: [], shake: 0, flash: 0, ripples: [] });
    const getMult = () => Math.min(6, 1 + Math.floor(S.combo / 6));
    const pop = (x, y, text, c, size) => S.pops.push({ x, y, text, c, size: size || 16, life: 0 });
    function resize() { const d = fitCanvas(cv, ctx, stage); W = d.W; H = d.H; }

    function spawnBubble() {
      const maxN = Math.min(7, 3 + Math.floor(S.t / 12));
      if (S.bubbles.length >= maxN) return;
      const rr = R(), roll = Math.random();
      const type = roll < 0.13 ? 'spike' : roll < 0.2 ? 'gold' : 'normal';
      let x = 0, y = 0, ok = false;
      for (let n = 0; n < 10 && !ok; n++) {
        x = rr + 10 + Math.random() * (W - 2 * rr - 20);
        y = 110 + rr + Math.random() * (H - 110 - 2 * rr - 20);
        ok = S.bubbles.every((b) => Math.hypot(b.x - x, b.y - y) > rr * 2.4);
      }
      if (!ok) return;
      const L = Math.max(0.9, 1.9 - S.t * 0.012) * (type === 'gold' ? 0.85 : 1);
      S.bubbles.push({ type, x, y, age: 0, L, ph: Math.random() * 6.28 });
    }

    function onTap(e) {
      if (S.mode !== 'play') return;
      const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, rr = R();
      S.taps++;
      let hit = -1;
      for (let i = S.bubbles.length - 1; i >= 0; i--) {
        const b = S.bubbles[i];
        if (Math.hypot(b.x - x, b.y - y) <= rr * 1.15 + 6) { hit = i; break; }
      }
      if (hit < 0) {
        S.ripples.push({ x, y, life: 0 });
        if (S.combo > 0) { S.combo = 0; }
        A.beep(150, 0.05, 'square', 0.02);
        return;
      }
      const b = S.bubbles.splice(hit, 1)[0];
      if (b.type === 'spike') {
        S.time = Math.max(0, S.time - 3); S.combo = 0; S.shake = 0.35; S.flash = 1;
        burstTo(S.parts, b.x, b.y, '#ff6b81', 14, 170);
        pop(b.x, b.y - 24, '-3秒', '#ff6b81', 20);
        A.beep(180, 0.3, 'sawtooth', 0.07, -110);
        return;
      }
      const before = getMult();
      S.combo++; S.hits++;
      if (S.combo > S.maxCombo) S.maxCombo = S.combo;
      const mult = getMult(), timing = Math.min(1, b.age / b.L);
      let pts = Math.round((10 + 10 * timing) * mult);
      if (b.type === 'gold') { pts *= 3; S.time = Math.min(TMAX, S.time + 2); pop(b.x, b.y - 46, '+2秒', '#ffd45e', 20); }
      S.score += pts;
      const col = b.type === 'gold' ? '#ffd45e' : '#6fe3cf';
      burstTo(S.parts, b.x, b.y, col, b.type === 'gold' ? 16 : 9, 140);
      pop(b.x, b.y - 22, '+' + pts, col, 16);
      if (mult > before) pop(W / 2, 150, '×' + mult + '!', '#6fe3cf', 24);
      A.beep(SCALE[S.combo % 8] * (S.combo >= 16 ? 2 : 1), 0.1, 'sine', 0.06);
    }

    function update(dt) {
      S.t += dt; S.time -= dt;
      S.spawn -= dt;
      if (S.spawn <= 0) { spawnBubble(); S.spawn += Math.max(0.25, 0.7 - S.t * 0.007) * (0.8 + Math.random() * 0.4); }
      for (let i = S.bubbles.length - 1; i >= 0; i--) {
        const b = S.bubbles[i];
        b.age += dt;
        if (b.age >= b.L) {
          S.bubbles.splice(i, 1);
          if (b.type !== 'spike') { if (S.combo >= 6) pop(b.x, b.y, 'コンボ切れ', '#a3aae0', 14); S.combo = 0; }
        }
      }

      stepParts(S.parts, dt); stepPops(S.pops, dt);
      for (let i = S.ripples.length - 1; i >= 0; i--) { S.ripples[i].life += dt; if (S.ripples[i].life > 0.35) S.ripples.splice(i, 1); }

    function drawBubble(b) {
      const rr = R(), x = b.x, y = b.y, pulse = 1 + 0.04 * Math.sin(S.t * 6 + b.ph);
      const ringR = rr * (1 + 1.1 * (1 - b.age / b.L));

      ctx.save();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = b.type === 'spike' ? 'rgba(255,107,129,0.8)' : b.type === 'gold' ? 'rgba(255,212,94,0.9)' : 'rgba(238,240,255,0.75)';
      if (urgent) ctx.strokeStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(x, y, ringR, 0, 6.283); ctx.stroke();
      if (b.type === 'spike') {
        ctx.shadowColor = '#ff6b81'; ctx.shadowBlur = 14;
        spikePath(ctx, x, y, rr * pulse * 1.05, S.t * -1.5); ctx.fillStyle = '#ff6b81'; ctx.fill();
        ctx.shadowBlur = 0; ctx.fillStyle = '#3a0f2a';
        ctx.beginPath(); ctx.arc(x, y, rr * 0.45, 0, 6.283); ctx.fill();
      } else {
        const g = ctx.createRadialGradient(x - rr * 0.3, y - rr * 0.3, rr * 0.1, x, y, rr);
        if (b.type === 'gold') { g.addColorStop(0, '#fff4bf'); g.addColorStop(1, '#f2b72e'); ctx.shadowColor = '#ffd45e'; }
        else { g.addColorStop(0, '#dffff8'); g.addColorStop(1, '#2fb7a3'); ctx.shadowColor = '#6fe3cf'; }
        ctx.shadowBlur = 16;
        ctx.beginPath(); ctx.arc(x, y, rr * pulse, 0, 6.283); ctx.fillStyle = g; ctx.fill();
        ctx.shadowBlur = 0;
        if (b.type === 'gold') { starPath(ctx, x, y, rr * 0.55, 0); ctx.fillStyle = '#fff'; ctx.fill(); }
        else { ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.arc(x - rr * 0.32, y - rr * 0.34, rr * 0.2, 0, 6.283); ctx.fill(); }
      }
      ctx.restore();
    }
    function draw(time) {
      ctx.save();
      if (S.shake > 0 && !reduce) ctx.translate((Math.random() - 0.5) * S.shake * 18, (Math.random() - 0.5) * S.shake * 18);
      drawSky(ctx, W, H, time, false);
      for (const rp of S.ripples) {
        ctx.globalAlpha = 1 - rp.life / 0.35; ctx.strokeStyle = '#a3aae0'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(rp.x, rp.y, 8 + rp.life * 70, 0, 6.283); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      for (const b of S.bubbles) drawBubble(b);
      drawParts(ctx, S.parts);
      drawPops(ctx, S.pops);
      ctx.restore();
      if (S.flash > 0 && !reduce) { ctx.fillStyle = 'rgba(255,107,129,' + (S.flash * 0.28) + ')'; ctx.fillRect(0, 0, W, H); }
    }
    function setText(key, v) { if (cache[key] !== v) { cache[key] = v; k(key).textContent = v; } }
    function hud() {
      setText('score', String(S.score));
      setText('tm', Math.ceil(S.time) + '秒');
      const w = Math.min(100, (S.time / TOTAL) * 100).toFixed(1) + '%';
      if (cache.w !== w) { cache.w = w; k('tFill').style.width = w; }

    }
    function endGame() {
      S.mode = 'over';
      [523, 440, 349, 262].forEach((f, i) => A.beep(f, 0.25, 'triangle', 0.06, 0, i * 0.14));
      const acc = S.taps ? Math.round((S.hits / S.taps) * 100) : 0;
      api.end(S.score, [['当てた数', S.hits], ['最大コンボ', S.maxCombo], ['命中率', acc + '%']]);
    }
    function frame(ts) {
      const dt = Math.min(0.05, (ts - last) / 1000 || 0) * DT();
      last = ts;
      if (S.mode === 'play') update(dt);
      draw(ts / 1000);
      hud();
      raf = requestAnimationFrame(frame);
    }
    stage.addEventListener('pointerdown', onTap);
    resize();

  function createSimon(stage, api) {

      <div class="mg-hud">

  /* ===== 共通: 角丸 ===== */

    return a;
  }

  /* ===== ゲーム4: ほしヘビ ===== */
  function createSnake(stage, api) {
    const root = el('div', 'gm', `
      <canvas class="cv" aria-label="ほしヘビのゲーム画面"></canvas>

        <div class="hud-row">

        </div>
        <div class="hud-row">
          <span class="chip" data-k="spd">スピード 1</span>

    let W = 360, H = 600, raf = 0, last = 0, S = null, cell = 20, ox = 0, oy = 96;
    const cache = {};

    function layout() {

      ox = Math.floor((W - cell * N) / 2);
      oy = 96 + Math.max(0, Math.floor((availH - cell * N) / 2));

    const interval = () => Math.max(0.07, 0.16 - (level() - 1) * 0.011);
    const gx = (x) => ox + x * cell + cell / 2;
    const gy = (y) => oy + y * cell + cell / 2;
    const pop = (x, y, text, c, size) => S.pops.push({ x, y, text, c, size: size || 16, life: 0 });

    function freeCell() {

        const x = Math.floor(Math.random() * N), y = Math.floor(Math.random() * N);
        if (S.snake.some((p) => p.x === x && p.y === y)) continue;
        if (S.food && S.food.x === x && S.food.y === y) continue;

  /* ===== ゲーム7: ほしくずし ===== */
  function createBreak(stage, api) {
    const root = el('div', 'gm', `

      <div class="hud">

    stage.append(root);

    const cv = $('canvas', root), ctx = cv.getContext('2d');
    const COLS = 8, TOP = 84, Y0 = 104, GAP = 4, PH = 12, M = 14, BH = 20;
    const COLORS = ['#ff6b81', '#ff9a66', '#ffd45e', '#6fe3cf', '#7fd1ff', '#8a62e8', '#e070c8', '#8fe08f'];
    let W = 360, H = 600, raf = 0, last = 0, S = null;
    const cache = {}, keys = { l: false, r: false };
    const bw = () => (W - 2 * M - GAP * (COLS - 1)) / COLS;
    const bx = (c) => M + c * (bw() + GAP);
    const by = (r) => Y0 + r * (BH + GAP);

    const padW = () => Math.min(W * 0.4, 100) * (S.wideT > 0 ? 1.5 : 1);
    const getMult = () => Math.min(5, 1 + Math.floor(S.combo / 3));
    const pop = (x, y, text, c, size) => S.pops.push({ x, y, text, c, size: size || 16, life: 0 });

    function resize() {
      const oldW = W, d = fitCanvas(cv, ctx, stage);

    }
    function makeBricks(level) {
      const rows = Math.min(8, 3 + level), out = [];

    }
    function makeState(mode) {
      const s = { mode, sub: 'ready', ready: 1.6, t: 0, level: 1, score: 0, lives: 3, combo: 0, maxCombo: 0, broken: 0, bricks: [], drops: [], parts: [], pops: [], shake: 0, flash: 0, wideT: 0, slowT: 0, px: W / 2, tx: W / 2, clearT: 0, sp: 300, ball: { x: W / 2, y: padY() - 8, vx: 0, vy: 0, r: 7 } };

    function newLevel() {

    function launch() {

    function fixAngle() {

      const m = Math.hypot(b.vx, b.vy) || S.sp;
      if (m !== S.sp) { b.vx *= S.sp / m; b.vy *= S.sp / m; }
    }
    function brickAt(x, y, r) {
      const w = bw();
      for (const br of S.bricks) {
        const x0 = bx(br.c), y0 = by(br.r);
        const cx = clampN(x, x0, x0 + w), cy = clampN(y, y0, y0 + BH);

    function damage(br) {

    function moveBall(dt) {

          else if (d.type === 'slow') { S.slowT = 8; pop(S.px, py - 30, 'スロー!', '#8fe08f', 18); }

    function draw(time) {
      ctx.save();

    function setText(key, v) { if (cache[key] !== v) { cache[key] = v; k(key).textContent = v; } }
    function hud() {

      setText('combo', S.combo + ' コンボ ×' + getMult());

      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keys.l = true; e.preventDefault(); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { keys.r = true; e.preventDefault(); }

    };
